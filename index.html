<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>请假</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #333333;
            --text-sub: #999999;
            --line-color: #eeeeee;
            --cyan-main: #47c1c4;
            --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        body {
            font-family: var(--font-family);
            font-weight: 350;
            background-color: var(--bg-color);
            margin: 0;
            padding-bottom: 80px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            line-height: 1.05;
            letter-spacing: 0;
        }

        /* 极简悬浮切换球 */
        #mode-btn {
            position: fixed;
            right: 10px;
            bottom: 10px;
            width: 5px;
            height: 5px;
            background: rgba(0, 0, 0, 0.2); 
            border: none;
            border-radius: 50%;
            z-index: 999;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .edit-mode #mode-btn {
            background: var(--cyan-main);
            box-shadow: 0 2px 10px rgba(71, 193, 196, 0.4);
        }
        
        .nav-bar { 
            background: #fff; 
            height: 46px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 17px; 
            font-weight: 500; 
            border-bottom: 1px solid var(--line-color);
            position: sticky; 
            top: 0; 
            z-index: 100;
        }

        /* 板块标题 */
        .section-title { 
            padding: 16px 16px 10px; 
            font-size: 17px; 
            font-weight: 600; 
            color: var(--text-main);
            border-bottom: 1px solid var(--line-color);
        }
        
        /* 单元格：加分割线，紧凑间距 */
        .cell { 
            display: flex; 
            padding: 12px 16px; 
            font-size: 16px; 
            position: relative; 
            line-height: 1.2; 
            border-bottom: 1px solid var(--line-color);
        }
        .cell:last-child {
            border-bottom: none;
        }
        .cell-label { 
            width: 105px; 
            color: var(--text-sub); 
            flex-shrink: 0; 
        }
        .cell-value { 
            flex: 1; 
            color: var(--text-main); 
            word-break: break-all; 
            text-align: right;
        }

        /* 证明材料附件 */
        .attachment-box {
            margin: 0; 
            padding: 12px 16px; 
            background: #f7f8fa; 
            display: flex; 
            align-items: center;
            border-bottom: 1px solid var(--line-color);
        }
        .file-icon {
            width: 32px; 
            height: 32px; 
            background: #fff; 
            border: 1px solid #ebedf0;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-right: 10px;
            color: #1989fa; 
            font-size: 18px; 
            font-weight: bold;
        }
        .attachment-info {
            flex: 1; 
            font-size: 14px;
        }
        .attachment-name {
            color: #323233;
            margin-bottom: 4px;
        }
        .attachment-size {
            color: #969799; 
            font-size: 12px;
        }

        /* --- 审核流程 --- */
        .steps-container { 
            background: #fff; 
            padding: 16px;
        }
        
        .step-item { 
            display: flex; 
            position: relative;
            min-height: 60px;
        }

        .step-left { 
            width: 30%; 
            text-align: right; 
            padding-right: 16px; 
            font-size: 14px; 
            color: var(--text-sub); 
            line-height: 1.3;
            padding-top: 4px;
            box-sizing: border-box;
        }

        .step-icon-column {
            width: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            position: relative;
        }

        .step-line {
            position: absolute;
            top: 24px;
            bottom: -10px;
            width: 1px;
            background-color: var(--line-color);
            z-index: 1;
        }
        .step-item:last-child .step-line { display: none; }

        .check-circle {
            width: 28px; 
            height: 28px; 
            background-color: var(--cyan-main); 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 2;
        }
        .check-circle svg { 
            width: 14px; 
            height: 14px; 
            fill: none; 
            stroke: white; 
            stroke-width: 3; 
        }

        .step-right {
            flex: 1;
            padding-left: 12px;
            padding-bottom: 16px;
            font-size: 16px;
            line-height: 1.4;
            color: var(--text-main);
        }
        .step-sub {
            font-size: 14px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* 底部按钮 */
        .footer { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            height: 50px; 
            display: flex; 
            background: #fff; 
            border-top: 1px solid #eee; 
            z-index: 100;
        }
        .footer button { 
            flex: 1; 
            border: none; 
            font-size: 16px; 
            background: #fff; 
            font-weight: 400; 
        }
        .btn-right { 
            background: var(--cyan-main) !important; 
            color: #fff; 
        }

        /* 模式控制 */
        input { 
            border: none; 
            outline: none; 
            background: transparent; 
            width: 100%; 
            color: inherit; 
            font: inherit; 
            padding: 0;
            text-align: right;
        }
        .preview-mode input { pointer-events: none; }
        .edit-mode input { border-bottom: 1px dashed #4fc08d; }
        .preview-mode .status-header { display: none; }
        .edit-mode .status-header { display: flex; }

        #mode-btn { 
            position: fixed; 
            right: 15px; 
            bottom: 70px; 
            background: rgba(0,0,0,0.6); 
            color: #fff; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            font-size: 12px; 
            z-index: 200; 
        }
    </style>
</head>
<body class="preview-mode">

<button id="mode-btn" onclick="toggleMode()"></button>

<!-- 去向信息 -->

    <div class="cell">

    <div class="cell">
        <div class="cell-label">来源类型</div>
        <div class="cell-value"><input type="text" value="学生申请"></div>
    </div>
    <div class="cell">
        <div class="cell-label">请假事由</div>
        <div class="cell-value"><input type="text" value="心理演讲比赛"></div>
    </div>
    <div class="cell" style="border:none; padding-bottom:0;">
        <div class="cell-label">证明材料 (1/9)</div>
        <div class="cell-value"></div>
    </div>
    <div class="attachment-box">
        <div class="file-icon">?</div>
        <div class="attachment-info">
            <div class="attachment-name">37GU_1SQQccn2M8JkoQey6OxJavzvpjCnPu6...</div>

        </div>
    </div>
    <div class="cell">
        <div class="cell-label">手机号</div>
        <div class="cell-value"><input type="text" value="17722970680"></div>
    </div>
</div>

<!-- 销假信息 -->
<div class="section">
    <div class="section-title">销假信息</div>
    <div class="cell">
        <div class="cell-label">销假状态</div>
        <div class="cell-value"><input type="text" value="已销假"></div>
    </div>
    <div class="cell">

    <div class="cell">

    <div class="cell">

    <div class="cell">

    </div>
    <div class="cell">
        <div class="cell-label">学生合照</div>

</div>

<!-- 审核流程 -->
<div class="section">
    <div class="section-title">审核流程</div>
    <div class="steps-container">
        <div class="step-item">
            <div class="step-left">2026-04-22<br>11:24</div>
            <div class="step-icon-column">
                <div class="check-circle"><svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"></path></svg></div>

        </div>

            <div class="step-right">
                辅导员审核通过
                <div class="step-sub">审核人：陈健-计</div>

        <div class="step-item">

            <div class="step-icon-column">

            </div>
            <div class="step-right">结束</div>
        </div>
    </div>
</div>

<!-- 底部按钮 -->
<div class="footer">
    <button>定位销假</button>
    <button class="btn-right">续假申请</button>
</div>

<script>
  function toggleMode() {
        const body = document.body;
        const isEdit = body.classList.contains('edit-mode');
        body.classList.toggle('edit-mode', !isEdit);
        body.classList.toggle('preview-mode', isEdit);
    }
</script>
</body>
</html>
