<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>请假</title>
    <style>
        :root {
            --bg-color: #f7f8fa;
            --text-main: #323233;
            --text-sub: #969799;
            --line-color: #ebedf0;
            --cyan-main: #47c1c4;
            --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        body {
            font-family: var(--font-family);
            font-weight: 350;
            background-color: var(--bg-color);
            margin: 0;
            padding-bottom: 100px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            line-height: 1.02;
            letter-spacing: 0px;
        }
        /* 极简悬浮切换球 */
        #mode-btn {
            position: fixed;
            right: 10px;
            bottom: 10px;
            width: 5px;
            height: 5px;
            background: rgba(0, 0, 0, 0.2); 
            border: none;
            border-radius: 50%;
            z-index: 999;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        /* 编辑模式下小球变色提醒 */
        .edit-mode #mode-btn {
            background: var(--cyan-main);
            box-shadow: 0 2px 10px rgba(71, 193, 196, 0.4);
        }
        
        .nav-bar { 
            background: #fff; height: 46px; display: flex; align-items: center; justify-content: center; 
            font-size: 17px; font-weight: 500; border-bottom: 1px solid var(--line-color);
            position: sticky; top: 0; z-index: 100;
        }

        /* 顶部状态标志 */
        .status-header {
            background: #fff; padding: 6px 16px; display: flex; align-items: center;
            color: var(--cyan-main); font-size: 15px; font-weight: 500;
        }

        /* 板块分割 极致缩小空隙 */
        .section { background: #fff; margin-top: 10px; position: relative; }
       .section::before {display: none; }
        .section:first-of-type::before { display: none; }

        .section-title { padding: 16px 16px 8px; /* 上边距16px，下边距8px */
                        font-size: 15px;       /* 稍微调大一点点 */
                         font-weight: 600; 
                         color: #323233;        /* 标题颜色 */
                         background-color: #fff;
                         border-bottom: 1px solid #ebedf0; /* 线条颜色使用你定义的变量颜色或这种浅灰色 */}
        /* 单元格 行距最小化 左对齐 */
        .cell { display: flex; padding: 2px 16px; font-size: 14px; position: relative; line-height: 1.02; }
        .cell:last-child::after { display: none; }
        .cell-label { width: 105px; color: var(--text-sub); flex-shrink: 0; }
        .cell-value { flex: 1; color: var(--text-main); word-break: break-all; text-align:left; }

        /* 证明材料附件 压缩间距 */
        .attachment-box {
            margin: 1px 16px 5px; padding: 5px; background: #f7f8fa; border-radius: 4px;
            display: flex; align-items: center;
        }
        .file-icon {
            width: 32px; height: 32px; background: #fff; border: 1px solid #ebedf0;
            display: flex; align-items: center; justify-content: center; margin-right: 10px;
            color: #1989fa; font-size: 18px; font-weight: bold;
        }

        /* 审核流程整体收紧 */
        .steps-container { background: #fff; padding: 6px 0; }
        
        .step-item { 
            display: flex; 
            position: relative;
            min-height: 38px;
        }

        .step-left { 
            width: 32%; 
            text-align: right; 
            padding-right: 15px; 
            font-size: 12px; 
            color: var(--text-sub); 
            line-height: 1.05;
            padding-top: 0px;
            box-sizing: border-box;
        }

        .step-icon-column {
            width: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            position: relative;
        }

        .step-line {
            position: absolute;
            top: 17px;
            bottom: -5px;
            width: 1px;
            background-color: var(--line-color);
            z-index: 1;
        }
        .step-item:last-child .step-line { display: none; }

        .check-circle {
            width: 20px; height: 20px; background-color: var(--cyan-main); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; z-index: 2;
        }
        .check-circle svg { width: 12px; height: 12px; fill: none; stroke: white; stroke-width: 3; }

        .step-right {
            flex: 1;
            padding-left: 10px;
            padding-bottom: 6px;
            font-size: 14px;
            line-height: 1.08;
            color: var(--text-main);
        }

        /* 底部按钮 */
        .footer { position: fixed; bottom: 0; width: 100%; height: 50px; display: flex; background: #fff; border-top: 1px solid #eee; z-index: 100; }
        .footer button { flex: 1; border: none; font-size: 16px; background: #fff; font-weight: 400; }
        .btn-right { background: var(--cyan-main) !important; color: #fff; }

        /* 输入框 纯左对齐 无内边距 */
        input { border: none; outline: none; background: transparent; width: 100%; color: inherit; font: inherit; padding:0; line-height:1.02; text-align:left; }
        .preview-mode input { pointer-events: none; }
        .edit-mode input { border-bottom: 1px dashed #4fc08d; }
        .preview-mode .status-header { display: flex; }
        .edit-mode .status-header { display: none; }

        #mode-btn { position: fixed; right: 15px; bottom: 70px; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; z-index: 200; }
    </style>
</head>
<body class="preview-mode">

<button id="mode-btn" onclick="toggleMode()"></button>
<div class="section">
    <div class="section-title">去向信息</div>
    <div class="cell"><div class="cell-label">是否出校</div><div class="cell-value"><input type="text" value="否"></div></div>

<div class="section">

    <div class="cell"><div class="cell-label">请假类型</div><div class="cell-value"><input type="text" value="公假"></div></div>
    <div class="cell"><div class="cell-label">请假性质</div><div class="cell-value"><input type="text" value="因公请假"></div></div>
    <div class="cell"><div class="cell-label">申请日期</div><div class="cell-value"><input type="text" value="2026-04-22 11:24"></div></div>
    <div class="cell"><div class="cell-label">请假开始日期</div><div class="cell-value"><input type="text" value="2026-04-22 08:00"></div></div>
    <div class="cell"><div class="cell-label">请假结束日期</div><div class="cell-value"><input type="text" value="2026-04-22 17:40"></div></div>
    <div class="cell"><div class="cell-label">请假天数</div><div class="cell-value"><input type="text" value="0.4"></div></div>
    <div class="cell"><div class="cell-label">来源类型</div><div class="cell-value"><input type="text" value="学生申请"></div></div>
    <div class="cell"><div class="cell-label">请假事由</div><div class="cell-value"><input type="text" value="心理演讲比赛"></div></div>
    <div class="cell" style="border:none"><div class="cell-label">证明材料 (1/9)</div></div>
    <div class="attachment-box">
        <div class="file-icon">?</div>
        <div style="flex:1; font-size:13px;">
            <div style="color:#323233;">37GU_1SQQccn2M8JkoQey6OxJavzvpjCnPu6...</div>
            <div style="color:#969799; font-size:12px;">621KB</div>
        </div>
    </div>
    <div class="cell"><div class="cell-label">手机号</div><div class="cell-value"><input type="text" value="17722970680"></div></div>
</div>

<div class="section">
    <div class="section-title">销假信息</div>
    <div class="cell"><div class="cell-label">销假状态</div><div class="cell-value" ><input type="text" value="未销假"></div></div>
    <div class="cell"><div class="cell-label">销假类型</div><div class="cell-value"><input type="text" value=""></div></div>
    <div class="cell"><div class="cell-label">销假日期</div><div class="cell-value"><input type="text" value=""></div></div>
    <div class="cell"><div class="cell-label">销假人</div><div class="cell-value"><input type="text" value=""></div></div>
    <div class="cell"><div class="cell-label">销假说明</div><div class="cell-value"><input type="text" value=""></div></div>
    <div class="cell"><div class="cell-label">合照示例</div><div class="cell-value"></div></div>
    <div class="cell"><div class="cell-label">学生合照</div><div class="cell-value"></div></div>
</div>

<div class="section">
    <div class="section-title">审核流程</div>
    <div class="steps-container">
        <div class="step-item">
            <div class="step-left">2026-04-22<br>11:24</div>
            <div class="step-icon-column">
                <div class="check-circle"><svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"></path></svg></div>
                <div class="step-line"></div>
            </div>
            <div class="step-right">提交申请</div>
        </div>
        <div class="step-item">
            <div class="step-left">2026-04-22<br>15:00:13</div>
            <div class="step-icon-column">
                <div class="check-circle"><svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"></path></svg></div>
                <div class="step-line"></div>
            </div>
            <div class="step-right">
                辅导员审核通过<br>
                <span style="color:var(--text-sub); font-size:13px">审核人：陈健-计</span><br>
                <span style="color:var(--text-sub); font-size:13px">审核意见：通过</span>
            </div>
        </div>
        <div class="step-item">
            <div class="step-left"></div>
            <div class="step-icon-column">
                <div class="check-circle"><svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"></path></svg></div>
            </div>
            <div class="step-right" style="padding-top:2px">结束</div>
        </div>
    </div>
</div>

<div class="footer">
    <button>定位销假</button>
    <button class="btn-right">续假申请</button>
</div>

<script>
  function toggleMode() {
        const body = document.body;
        const isEdit = body.classList.contains('edit-mode');
        body.classList.toggle('edit-mode', !isEdit);
        body.classList.toggle('preview-mode', isEdit);
    }
</script>
</body>
</html>
