<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>请假</title>
    <style>
        :root {
            --bg-color: #f7f8fa;
            --text-main: #323233;
            --text-sub: #969799;
            --line-color: #ebedf0;
            --cyan-main: #47c1c4;
            --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            margin: 0;
            padding-bottom: 100px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            /* 增加全局行距与字间距 */
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        /* 顶部导航 */
        .nav-bar { 
            background: #fff; height: 46px; display: flex; align-items: center; justify-content: center; 
            font-size: 17px; font-weight: 500; border-bottom: 1px solid var(--line-color);
            position: sticky; top: 0; z-index: 100;
        }

        /* 板块：通过 margin-top 撑开灰色空隙 */
        .section { background: #fff; margin-top: 10px; position: relative; }
        
        /* 小标题：去掉粗体，加细横线 */
        .section-title { 
            padding: 16px 16px 10px; 
            font-size: 15px; 
            font-weight: 400; 
            color: var(--text-main); 
            background-color: #fff;
            border-bottom: 1px solid var(--line-color); 
        }

        /* 单元格布局 */
        .cell { display: flex; padding: 12px 16px; font-size: 14px; line-height: 1.4; align-items: flex-start;}
        
        .cell-label { width: 105px; color: var(--text-sub); flex-shrink: 0; }
        
        /* 强制右侧文字为深黑色 */
        .cell-value { flex: 1; color: #323233 !important; word-break: break-all; text-align:left; }

        /* 输入框样式 */
        input { 
            border: none; outline: none; background: transparent; width: 100%; 
            color: #323233 !important; font: inherit; padding:0; text-align:left;
            -webkit-text-fill-color: #323233; /* 兼容 iOS */
            opacity: 1;
        }

        /* 证明材料附件区域 */
        .attachment-upload { display: block; cursor: pointer; }
        .attachment-upload:active { opacity: 0.6; }

        .attachment-box {
            margin: 4px 16px 12px; 
            padding: 10px; 
            background: #f7f8fa; 
            border-radius: 8px;
            display: flex; 
            align-items: center;
            border: 1px dashed #dcdee0;
        }

        .file-icon {
            width: 40px; height: 40px; background: #fff; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; margin-right: 12px;
            border: 1px solid #ebedf0;
        }

        /* 审核流程 */
        .steps-container { background: #fff; padding: 15px 0; }
        .step-item { display: flex; position: relative; min-height: 50px; }
        .step-left { 
            width: 32%; text-align: right; padding-right: 15px; 
            font-size: 12px; color: var(--text-sub); line-height: 1.2;
        }
        .step-icon-column { width: 40px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .step-line { 
            position: absolute; top: 20px; bottom: 0; width: 1px; 
            background-color: var(--line-color); z-index: 1; 
        }
        .step-item:last-child .step-line { display: none; }
        .check-circle { 
            width: 20px; height: 20px; background-color: var(--cyan-main); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; 
        }
        .check-circle svg { width: 12px; height: 12px; fill: none; stroke: white; stroke-width: 3; }
        .step-right { flex: 1; padding-left: 10px; font-size: 14px; line-height: 1.4; color: var(--text-main); }

        /* 底部按钮 */
        .footer { position: fixed; bottom: 0; width: 100%; height: 50px; display: flex; background: #fff; border-top: 1px solid #eee; z-index: 100; }
        .footer button { flex: 1; border: none; font-size: 16px; background: #fff; color: var(--cyan-main); }
        .btn-right { background: var(--cyan-main) !important; color: #fff !important; }

        /* 模式切换按钮 */
        #mode-btn { position: fixed; right: 15px; bottom: 70px; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; z-index: 200; }
        .preview-mode input { pointer-events: none; }
        .edit-mode input { border-bottom: 1px dashed var(--cyan-main); }
    </style>
</head>
<body class="preview-mode">

<button id="mode-btn" onclick="toggleMode()"></button>
<div class="section">
    <div class="section-title">去向信息</div>
    <div class="cell"><div class="cell-label">是否出校</div><div class="cell-value"><input type="text" value="是"></div></div>
    <div class="cell"><div class="cell-label">是否离开学校所在地</div><div class="cell-value"><input type="text" value="否"></div></div>
</div>

<div class="section">
    <div class="section-title">请假信息</div>
    <div class="cell"><div class="cell-label">学年</div><div class="cell-value"><input type="text" value="2025-2026学年"></div></div>
    <div class="cell"><div class="cell-label">学期</div><div class="cell-value"><input type="text" value="第二学期"></div></div>
    <div class="cell"><div class="cell-label">请假类型</div><div class="cell-value"><input type="text" value="公假"></div></div>
    <div class="cell"><div class="cell-label">请假性质</div><div class="cell-value"><input type="text" value="因公请假"></div></div>
    <div class="cell"><div class="cell-label">申请日期</div><div class="cell-value"><input type="text" value="2026-04-22 11:24"></div></div>
    <div class="cell"><div class="cell-label">请假开始日期</div><div class="cell-value"><input type="text" value="2026-04-22 08:00"></div></div>
    <div class="cell"><div class="cell-label">请假结束日期</div><div class="cell-value"><input type="text" value="2026-04-22 17:40"></div></div>
    <div class="cell"><div class="cell-label">请假天数</div><div class="cell-value"><input type="text" value="0.4"></div></div>
    <div class="cell"><div class="cell-label">来源类型</div><div class="cell-value"><input type="text" value="学生申请"></div></div>
    <div class="cell"><div class="cell-label">请假事由</div><div class="cell-value"><input type="text" value="心理演讲比赛"></div></div>
    
    <div class="cell" style="padding-bottom:0;"><div class="cell-label">证明材料 (1/9)</div></div>
    <label class="attachment-upload" for="file-input">
        <input type="file" id="file-input" style="display: none;" onchange="handleFile(this)">
        <div class="attachment-box">
            <div class="file-icon">
                <svg viewBox="0 0 1024 1024" width="20" height="20" fill="#1989fa"><path d="M854.6 288.7L639.4 73.5c-12.5-12.5-32.8-12.5-45.3 0l-452.6 452.6c-12.5 12.5-12.5 32.8 0 45.3l215.1 215.1c12.5 12.5 32.8 12.5 45.3 0l452.6-452.6c12.6-12.5 12.6-32.8 0.1-45.2zM379.9 741.3L209.6 571l407.3-407.3 170.3 170.3-407.3 407.3z"></path></svg>
            </div>
            <div style="flex:1; line-height: 1.2;">
                <div id="file-name" style="color:#323233; font-size:13px;">37GU_1SQQccn2M8JkoQey6OxJavzvpjCnPu6...</div>
                <div id="file-size" style="color:#969799; font-size:12px;">621KB</div>
            </div>
        </div>
    </label>
    
    <div class="cell">
        <div class="cell-label">手机号</div>
        <div class="cell-value"><input type="text" value="17722970680"></div>
    </div>
</div>

<div class="section">
    <div class="section-title">销假信息</div>
    <div class="cell"><div class="cell-label">销假状态</div><div class="cell-value" ><input type="text" value="未销假"></div></div>
    <div class="cell"><div class="cell-label">销假类型</div><div class="cell-value"><input type="text" value=""></div></div>
    <div class="cell"><div class="cell-label">销假日期</div><div class="cell-value"><input type="text" value=""></div></div>
    <div class="cell"><div class="cell-label">销假人</div><div class="cell-value"><input type="text" value=""></div></div>
    <div class="cell"><div class="cell-label">销假说明</div><div class="cell-value"><input type="text" value=""></div></div>
</div>

<div class="section">
    <div class="section-title">审核流程</div>
    <div class="steps-container">
        <div class="step-item">
            <div class="step-left">
                <input type="text" value="2026-04-22" style="text-align: right; font-size: 12px colo;"><br>
                <input type="text" value="11:24" style="text-align: right; font-size: 12px;">
            </div>
            <div class="step-icon-column">
                <div class="check-circle"><svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"></path></svg></div>
                <div class="step-line"></div>
            </div>
            <div class="step-right"> <span style="color:var(--text-sub); ">提交申请</span></div>
        </div>
        <div class="step-item">
            <div class="step-left">
                <input type="text" value="2026-04-22" style="text-align: right; font-size: 12px;"><br>
                <input type="text" value="11:24" style="text-align: right; font-size: 12px;">
            </div>
            <div class="step-icon-column">
                <div class="check-circle"><svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"></path></svg></div>
                <div class="step-line"></div>
            </div>
            <div class="step-right">
                <span style="color:var(--text-sub); ">辅导员审核</span><br>
                <span style="color:var(--text-sub); font-size:13px">通过</span><br>
                <span style="color:var(--text-sub); font-size:13px">审核人：陈健-计</span><br>
                <span style="color:var(--text-sub); font-size:13px">审核意见：通过</span>
            </div>
        </div>
        <div class="step-item">
            <div class="step-left"></div>
            <div class="step-icon-column">
                <div class="check-circle"><svg viewBox="0 0 24 24"><path d="M20 6L9 17L4 12"></path></svg></div>
            </div>
            <div class="step-right" style="padding-top:2px"><span style="color:var(--text-sub); ">结束</span></div>
        </div>
    </div>
</div>

<div class="footer">
    <button>定位销假</button>
    <button class="btn-right">续假申请</button>
</div>

<script>
    function toggleMode() {
        const body = document.body;
        const btn = document.getElementById('mode-btn');
        const isEdit = body.classList.contains('edit-mode');
        body.classList.toggle('edit-mode', !isEdit);
        body.classList.toggle('preview-mode', isEdit);;
    }

    function handleFile(input) {
        const fileNameDisplay = document.getElementById('file-name');
        const fileSizeDisplay = document.getElementById('file-size');
        if (input.files && input.files[0]) {
            const file = input.files[0];
            fileNameDisplay.innerText = file.name;
            const size = file.size > 1024 * 1024 
                ? (file.size / (1024 * 1024)).toFixed(2) + 'MB' 
                : (file.size / 1024).toFixed(2) + 'KB';
            fileSizeDisplay.innerText = size;
        }
    }
</script>
</body>
</html>
